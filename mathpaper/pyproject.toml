[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "math-paper-chatbot"
version = "0.1.0"
description = "A source-grounded research assistant with hybrid retrieval, MiniLM reranking, and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2", "numpy>=1.26,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.12,<1", "onnxruntime>=1.31,<2", "tokenizers>=0.23,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
agent = ["fastmcp>=4.1,<5"]

[project.scripts]
mathpaper = "mathpaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mathpaper = ["web/*", "model-lock*.json"]
